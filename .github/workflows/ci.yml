name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Cross-compile (linux/amd64)
        run: GOOS=linux GOARCH=amd64 go build -o /dev/null .

      - name: Cross-compile (darwin/arm64)
        run: GOOS=darwin GOARCH=arm64 go build -o /dev/null .

  race:
    name: race detector (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      # The race detector requires cgo, which is fine on Linux. It is not run
      # on macOS: Go 1.23.x + recent macOS produces test binaries missing the
      # LC_UUID load command (dyld refuses them), so cgo/race builds fail there.
      - name: Test with race detector
        run: CGO_ENABLED=1 go test -race -count=1 ./...
