name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CGO_ENABLED: "0"

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      # Never publish a release that fails the same gate CI enforces.
      - name: Test
        run: go test -count=1 ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
