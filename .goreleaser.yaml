version: 2

project_name: portlens

before:
  hooks:
    - go mod tidy

builds:
  - id: portlens
    main: .
    binary: portlens
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/mishraprayash/Portlens/internal/version.Version={{.Version}}

archives:
  - id: portlens
    formats: [tar.gz]
    name_template: "portlens_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: mishraprayash
    name: Portlens
